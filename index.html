<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Up for a walk?</title>
<meta name="description" content="Walk pe chal rahi ho? There is only one correct answer." />
<meta property="og:title" content="Up for a walk?" />
<meta property="og:description" content="Walk pe chal rahi ho? (The No button runs away.)" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%92%97</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff5d8f;
    --pink-deep:#e03e74;
    --cream:#fff6f2;
    --ink:#3b2233;
    --card:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Fredoka", ui-rounded, "Segoe UI", system-ui, sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 700px at 12% 8%, #ffe3ec 0%, transparent 60%),
      radial-gradient(1000px 700px at 88% 92%, #ffe9d6 0%, transparent 60%),
      linear-gradient(160deg,#fff1f4 0%, var(--cream) 50%, #fdeaf1 100%);
    min-height:100dvh;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  /* floating hearts background */
  #sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .floaty{
    position:absolute;
    bottom:-60px;
    font-size:22px;
    opacity:.55;
    animation:rise linear forwards;
    will-change:transform,opacity;
  }
  @keyframes rise{
    0%{transform:translateY(0) rotate(0deg) scale(.7);opacity:0}
    12%{opacity:.6}
    100%{transform:translateY(-115dvh) rotate(var(--spin,180deg)) scale(1.1);opacity:0}
  }

  .stage{
    position:relative;z-index:1;
    min-height:100dvh;
    display:grid;place-items:center;
    padding:24px 18px calc(24px + env(safe-area-inset-bottom,0px));
  }

  .card{
    width:min(560px,100%);
    background:var(--card);
    border-radius:28px;
    padding:38px 30px 34px;
    text-align:center;
    box-shadow:0 30px 60px -22px rgba(224,62,116,.45), 0 0 0 1px rgba(255,93,143,.10);
    position:relative;
    animation:pop .5s cubic-bezier(.2,1.3,.4,1) both;
  }
  @keyframes pop{from{transform:scale(.88) translateY(14px);opacity:0}to{transform:none;opacity:1}}

  .card::before{
    content:"💗";
    position:absolute;top:-26px;left:50%;transform:translateX(-50%);
    font-size:42px;
    filter:drop-shadow(0 6px 10px rgba(224,62,116,.35));
    animation:beat 1.1s ease-in-out infinite;
  }
  @keyframes beat{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.18)}}

  .kicker{
    font-family:"Caveat",cursive;
    font-size:clamp(20px,5vw,26px);
    color:var(--pink-deep);
    margin:8px 0 2px;
    letter-spacing:.4px;
  }
  h1{
    font-size:clamp(28px,7.2vw,44px);
    font-weight:700;
    margin:6px 0 4px;
    line-height:1.15;
    background:linear-gradient(90deg,var(--pink-deep),#ff8fab,var(--pink));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{
    margin:10px 0 26px;
    font-size:clamp(14px,3.6vw,16px);
    color:#8a6b7c;
    font-weight:400;
  }

  .btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  button{
    font-family:inherit;font-weight:600;
    font-size:clamp(16px,4.2vw,19px);
    border:0;border-radius:999px;
    padding:15px 40px;
    cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  #yes{
    background:linear-gradient(135deg,var(--pink),var(--pink-deep));
    color:#fff;
    box-shadow:0 12px 24px -8px rgba(224,62,116,.75);
  }
  #yes:hover{transform:translateY(-3px) scale(1.05)}
  #yes:active{transform:scale(.97)}

  #no{
    background:#fff;
    color:#a98b9a;
    box-shadow:inset 0 0 0 2px #ffd9e4;
    transition:transform .22s cubic-bezier(.2,1.2,.4,1), left .09s ease-out, top .09s ease-out, opacity .3s ease;
  }
  #no.loose{
    position:fixed;
    margin:0;
    z-index:50;
  }
  .hint{
    margin-top:22px;
    font-family:"Caveat",cursive;
    font-size:19px;
    color:#c58aa0;
    min-height:24px;
  }

  /* ---- screen 2 ---- */
  #screen2{display:none}
  #screen2.on{display:block}
  .big-emoji{font-size:clamp(52px,14vw,74px);line-height:1;margin-bottom:6px;animation:wiggle 2s ease-in-out infinite}
  @keyframes wiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  .yay{
    font-size:clamp(26px,6.6vw,38px);font-weight:700;color:var(--pink-deep);margin:4px 0 2px;line-height:1.2;
  }
  .shot{
    margin:20px auto 0;
    max-width:430px;
    background:linear-gradient(135deg,#fff0f5,#fff7ef);
    border:2px dashed #ffb3c9;
    border-radius:18px;
    padding:16px 18px;
    font-size:clamp(14px,3.7vw,16px);
    color:#8a5c70;
    font-weight:500;
  }
  .shot b{color:var(--pink-deep)}
  .stamp{
    margin-top:18px;font-family:"Caveat",cursive;font-size:20px;color:#c58aa0;
  }
  .again{
    margin-top:16px;background:none;border:0;color:#c9a3b2;
    font-size:14px;text-decoration:underline;padding:6px;cursor:pointer;font-family:inherit;
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important}
  }
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>

<main class="stage">
  <section class="card" id="card">

    <div id="screen1">
      <p class="kicker">ek chhoti si guzaarish…</p>
      <h1>Walk pe chal rahi ho?</h1>
      <p class="sub">Mausam accha hai, sadak khaali hai, aur main ready hoon. 🌸</p>
      <div class="btns">
        <button id="yes" type="button">Yes 💕</button>
        <button id="no" type="button">No</button>
      </div>
      <p class="hint" id="hint"></p>
    </div>

    <div id="screen2">
      <div class="big-emoji">🚶‍♀️💞🚶</div>
      <p class="yay">Okay, I'm coming in 5 minutes.</p>
      <p class="sub">(ready ho jao, shoes pehen lo 👟)</p>
      <div class="shot">
        📸 <b>Please send this screenshot</b> to the person you want to go on a walk with.
      </div>
      <p class="stamp">yes bolne ke liye thank you 💗</p>
      <button class="again" id="again" type="button">poochho dobara</button>
    </div>

  </section>
</main>

<script>
(function(){
  /* ---------- floating hearts ---------- */
  var sky = document.getElementById('sky');
  var chars = ['💗','💕','🌸','💖','🤍','🩷','✨','💘'];
  function heart(){
    var el = document.createElement('div');
    el.className = 'floaty';
    el.textContent = chars[Math.floor(Math.random()*chars.length)];
    el.style.left = Math.random()*100 + 'vw';
    el.style.fontSize = (14 + Math.random()*26) + 'px';
    var dur = 7 + Math.random()*7;
    el.style.animationDuration = dur + 's';
    el.style.setProperty('--spin', (Math.random()*720-360)+'deg');
    sky.appendChild(el);
    setTimeout(function(){ el.remove(); }, dur*1000 + 400);
  }
  for(var i=0;i<12;i++) setTimeout(heart, i*400);
  setInterval(heart, 650);

  function burst(n){
    for(var i=0;i<n;i++) setTimeout(heart, i*60);
  }

  /* ---------- the untouchable NO ---------- */
  var no = document.getElementById('no');
  var yes = document.getElementById('yes');
  var hint = document.getElementById('hint');
  var lines = [
    'arre… No dabane ki koshish mat karo 😌',
    'No button thoda shy hai.',
    'thoda aur paas aao… nahi, wahi nahi 🏃',
    'physics ke khilaaf hai ye button.',
    'ek hi sahi answer hai yahan 💗',
    'haar maan lo, Yes dabao.',
    'No: "mujhe mat chhuo" 🙈',
    'seriously? abhi tak No?'
  ];
  var dodges = 0;
  var SAFE = 96;            // personal space of the No button
  var lastHint = 0;

  function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }

  function loosen(){
    if(no.classList.contains('loose')) return;
    var r = no.getBoundingClientRect();
    no.style.width = r.width + 'px';
    no.style.height = r.height + 'px';
    no.style.left = r.left + 'px';
    no.style.top = r.top + 'px';
    no.classList.add('loose');
  }

  function tease(){
    dodges++;
    var now = Date.now();
    if(now - lastHint > 900){
      lastHint = now;
      hint.textContent = lines[Math.min(dodges, lines.length) - 1] || lines[lines.length-1];
    }
    if(dodges > 4){
      yes.style.transform = 'scale(' + Math.min(1.3, 1 + (dodges-4)*0.03) + ')';
    }
  }

  /* slide a short distance directly away from the pointer, staying on screen */
  function shuffle(px, py){
    loosen();
    var r = no.getBoundingClientRect();
    var cx = r.left + r.width/2, cy = r.top + r.height/2;
    var dx = cx - px, dy = cy - py;
    var d = Math.hypot(dx, dy);
    if(d > SAFE) return;

    if(d < 1){ dx = (Math.random()-0.5); dy = (Math.random()-0.5); d = Math.hypot(dx,dy) || 1; }
    var ux = dx/d, uy = dy/d;
    var step = (SAFE - d) + 34;          // just enough to stay out of reach

    var pad = 10;
    var maxX = Math.max(pad, window.innerWidth  - r.width  - pad);
    var maxY = Math.max(pad, window.innerHeight - r.height - pad);

    var nx = r.left + ux*step;
    var ny = r.top  + uy*step;
    var cnx = clamp(nx, pad, maxX);
    var cny = clamp(ny, pad, maxY);

    /* cornered? slip sideways along the wall instead of sitting there */
    if(Math.abs(cnx - nx) > 1 || Math.abs(cny - ny) > 1){
      var tx = -uy, ty = ux;                       // perpendicular
      var sideA = Math.hypot(clamp(r.left + tx*step, pad, maxX) - px, clamp(r.top + ty*step, pad, maxY) - py);
      var sideB = Math.hypot(clamp(r.left - tx*step, pad, maxX) - px, clamp(r.top - ty*step, pad, maxY) - py);
      var s = sideA >= sideB ? 1 : -1;
      cnx = clamp(r.left + (tx*s*step*1.25) + ux*step*0.35, pad, maxX);
      cny = clamp(r.top  + (ty*s*step*1.25) + uy*step*0.35, pad, maxY);
    }

    no.style.left = cnx + 'px';
    no.style.top  = cny + 'px';
    no.style.transform = 'rotate(' + (Math.random()*16-8) + 'deg) scale(' + Math.max(0.82, 1 - dodges*0.01) + ')';
    tease();
  }

  /* a desperate lunge straight at it (tap / click) gets a bigger hop */
  function hop(px, py){
    loosen();
    var r = no.getBoundingClientRect();
    var a = Math.atan2((r.top + r.height/2) - py, (r.left + r.width/2) - px) + (Math.random()-0.5);
    shuffle(px - Math.cos(a)*4, py - Math.sin(a)*4);
    var pad = 10;
    var maxX = Math.max(pad, window.innerWidth  - r.width  - pad);
    var maxY = Math.max(pad, window.innerHeight - r.height - pad);
    no.style.left = clamp((parseFloat(no.style.left)||0) + Math.cos(a)*70, pad, maxX) + 'px';
    no.style.top  = clamp((parseFloat(no.style.top) ||0) + Math.sin(a)*70, pad, maxY) + 'px';
  }

  ['mouseenter','mouseover','mousedown','pointerdown','pointerenter','touchstart','focus','click'].forEach(function(ev){
    no.addEventListener(ev, function(e){
      e.preventDefault(); e.stopPropagation();
      var t = (e.touches && e.touches[0]) || e;
      var r = no.getBoundingClientRect();
      hop(t.clientX != null ? t.clientX : r.left + r.width/2,
          t.clientY != null ? t.clientY : r.top + r.height/2);
    }, {passive:false});
  });

  /* keep its distance from the cursor at all times */
  window.addEventListener('mousemove', function(e){ shuffle(e.clientX, e.clientY); });
  window.addEventListener('pointermove', function(e){ shuffle(e.clientX, e.clientY); });
  window.addEventListener('touchmove', function(e){
    var t = e.touches[0]; if(t) shuffle(t.clientX, t.clientY);
  }, {passive:true});

  window.addEventListener('resize', function(){
    if(!no.classList.contains('loose')) return;
    var r = no.getBoundingClientRect();
    no.style.left = clamp(parseFloat(no.style.left)||0, 10, Math.max(10, window.innerWidth  - r.width  - 10)) + 'px';
    no.style.top  = clamp(parseFloat(no.style.top) ||0, 10, Math.max(10, window.innerHeight - r.height - 10)) + 'px';
  });

  /* ---------- yes ---------- */
  var s1 = document.getElementById('screen1');
  var s2 = document.getElementById('screen2');
  var card = document.getElementById('card');

  yes.addEventListener('click', function(){
    burst(45);
    s1.style.display = 'none';
    s2.classList.add('on');
    no.style.opacity = '0';
    no.style.pointerEvents = 'none';
    card.style.animation = 'none';
    void card.offsetWidth;
    card.style.animation = 'pop .5s cubic-bezier(.2,1.3,.4,1) both';
    history.replaceState(null,'','#yes');
  });

  document.getElementById('again').addEventListener('click', function(){
    s2.classList.remove('on');
    s1.style.display = '';
    dodges = 0;
    hint.textContent = '';
    yes.style.transform = '';
    no.className = '';
    no.removeAttribute('style');
    history.replaceState(null,'',' ');
  });
})();
</script>
</body>
</html>
